name: Bug report
description: Something in the Crew ↔ Cursor bridge failed
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do **not** paste tokens, `.env`, or `state.vscdb`.
        Attach `doctor` output and a redacted `bridge.log`.
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: `cursor-crew doctor` output
      render: text
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "bridge 0.3.0, Kiro Crew ?, Cursor ?"
